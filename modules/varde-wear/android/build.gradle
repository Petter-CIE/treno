plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'no.cie.varde.wearbridge'
version = '0.1.0'

android {
  namespace "no.cie.varde.wearbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
